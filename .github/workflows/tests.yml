name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: |
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 NUMBA_NUM_THREADS=1 MKL_NUM_THREADS=1 python benchmarks/benchmark_suite.py --case small_continuous --engine dense --repeats 1 --warmup 0

  rust-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jhnrckmnznrs/persistence_images
          ref: feat/stable-cdf-bases
          path: rust-reference
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python scripts/compare_with_rust.py rust-reference
      - run: python scripts/compare_stable_with_rust.py rust-reference

  benchmark-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jhnrckmnznrs/persistence_images
          ref: feat/stable-cdf-bases
          path: rust-reference
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Compare exact backends on small diagrams
        run: |
          python benchmarks/run_suite.py --rust-repo rust-reference \
            --profile smoke --cases small_continuous,small_quantized \
            --engines python:dense,rust:separable \
            --warmup 0 --repeats 1 --strict \
            --output-dir benchmark-results/exact
      - name: Compare one-FFT backends on medium diagrams
        run: |
          python benchmarks/run_suite.py --rust-repo rust-reference \
            --profile standard --cases medium_continuous \
            --engines python:interp_fft,rust:interp-fft \
            --warmup 1 --repeats 1 --strict \
            --output-dir benchmark-results/fft
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-parity-reports
          path: benchmark-results/
