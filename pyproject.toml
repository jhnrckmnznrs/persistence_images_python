[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persistence-images-python"
version = "0.5.0"
description = "Python persistence images with adaptive Gaussian summation and certified one-FFT interpolation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "John Rick Manzanares" }]
license = "MIT"
dependencies = ["numpy>=1.24"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
fast = ["numba>=0.61"]
grid = ["numba>=0.61", "scipy>=1.10"]
test = ["pytest>=8"]
dev = ["pytest>=8", "numba>=0.61", "scipy>=1.10"]

[project.scripts]
persistence-images = "persistence_images.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
